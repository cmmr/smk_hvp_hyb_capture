# =============================================================================
# Simple Snakemake Pipeline Configuration
# Hybrid capture virome sequencing: Decompress reads, run EsViritu,
# and quantify host reads.
# =============================================================================

# -----------------------------------------------------------------------------
# Required inputs
# -----------------------------------------------------------------------------
# Pool identifier - combined with Sample_ID to create unique_id
pool_id: "p2026"

# Path to sample sheet (TSV with columns: Sample_ID, forward_read, reverse_read, read_compression, category)
sample_sheet: "example_data/p2026_ex_sample_sheet.tsv"

# Path to EsViritu database directory
esviritu_db: "/biolib/prod/db/esviritu_DBs/v3.2.4"

# Path to vector sequences for read removal 
vector_fasta: "/data/prod/db/vector_dbs/nihcqv_hiv1/vector_seqs.fna"

# Path to host genome for host read quantification
host_genome: "/biolib/prod/db/chm13v2phix/chm13v2phix.mmi"

# -----------------------------------------------------------------------------
# Output directories
# -----------------------------------------------------------------------------
# Root output directory - TEMP_ROOT and ESVIRITU_ROOT are derived from this
output_root: "results"

# -----------------------------------------------------------------------------
# Resource allocation
# -----------------------------------------------------------------------------
# Threads for decompression (pigz/lbzip2)
decompress_threads: 8

# Threads for fastp quality filtering
fastp_threads: 16

# Threads for vector read removal
vrr_threads: 8

# Threads for EsViritu
esviritu_threads: 8

# Threads for host read quantification
host_reads_threads: 8

# Memory allocation (in MB)
decompress_mem_mb: 8000
fastp_mem_mb: 16000
vrr_mem_mb: 8000
esviritu_mem_mb: 8000
host_reads_mem_mb: 8000
